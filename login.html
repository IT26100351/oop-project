<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - HomeFinder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="navbar"></div>
<div class="form-page"><div class="box">
  <h1>Log in</h1>
  <p class="muted">Log in to create a listing.</p>
  <div class="msg" id="msg"></div>
  <div class="field"><label>Email</label><input id="email" type="email"></div>
  <div class="field"><label>Password</label><input id="password" type="password"></div>
  <button class="btn" id="go" style="width:100%">Log in</button>
  <p class="muted center">New here? <a href="signup.html" style="color:var(--blue-dark);font-weight:700">Create an account</a></p>
</div></div>
<div id="footer"></div>
<script src="js/app.js"></script>
<script>
  renderNavbar("");
  document.getElementById("go").onclick = async () => {
    const msg = document.getElementById("msg");
    msg.className = "msg";
    // send ONLY email + password to the backend
    const res = await fetch(API + "/api/users/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: document.getElementById("email").value, password: document.getElementById("password").value })
    });
    if (!res.ok) { msg.textContent = await res.text(); msg.className = "msg err"; return; }
    localStorage.setItem("user", JSON.stringify(await res.json()));  // remember the user
    location.href = "index.html";                                     // back to the front page
  };
</script>
</body></html>
